[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot"
version = "0.1.0"
description = "BlindSpot: AI Critical-Thinking & Decision Quality Analysis Engine"
readme = "README.md"
authors = [{ name = "BlindSpot Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "Flask>=3.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
blindspot = "blindspot.cli.main:main"
blindspot-server = "blindspot.api.app:create_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["blindspot*"]
